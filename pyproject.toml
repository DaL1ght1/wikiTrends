[project]
name = "wikitrends"
version = "2.0.0"
description = "Real-time trending Wikipedia pages: Wikimedia SSE -> Kafka -> Spark -> OpenSearch/HBase -> web UI"
requires-python = ">=3.11"
# Runtime dependencies live in each app's requirements.txt (apps/*/requirements.txt),
# because every app ships as its own container. This file only drives local dev
# tooling: linting and the unit tests in tests/.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "apps/sse-ingestor",
    "apps/trending-indexer",
    "apps/hbase-writer",
    "apps/trending-ui",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps/trending-ui/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Each app is a flat folder of modules imported by bare name.
known-first-party = ["events", "docs", "rows", "queries", "http_util", "titles", "stories", "alerts"]
