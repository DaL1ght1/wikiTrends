name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also start the full stack and run the smoke test"
        type: boolean
        default: false

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Validate compose file
        run: docker compose config -q

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build all application images
        run: docker compose build

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: TIMEOUT=900 ./scripts/smoke-test.sh
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
