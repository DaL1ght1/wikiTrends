apiVersion: 1


deleteDatasources:
  - name: OpenSearch
    orgId: 1


datasources:
  - name: OpenSearch
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    jsonData:
      database: "trending-1m-*"
      flavor: "opensearch"
      timeField: "ts_bucket"
      version: "2.14.0"
      interval: "10s"
    isDefault: true